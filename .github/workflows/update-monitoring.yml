name: Update Monitoring & Security Scanning

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    paths:
      - 'docker-compose.yml'
      - 'workflows/**'

jobs:
  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check n8n releases
        run: |
          echo "Checking n8n releases..."
          LATEST_N8N=$(curl -s "https://api.github.com/repos/n8n-io/n8n/releases/latest" | jq -r '.tag_name')
          CURRENT_N8N=$(grep "image: n8nio/n8n" docker-compose.yml | sed 's/.*image: n8nio\/n8n://' | head -1)
          echo "Current: $CURRENT_N8N"
          echo "Latest: $LATEST_N8N"

          if [ "$CURRENT_N8N" != "$LATEST_N8N" ]; then
            echo "::warning::n8n update available: $LATEST_N8N"
          fi

      - name: Check Docker image updates
        run: |
          echo "Checking Docker image versions..."
          # Extract images from docker-compose.yml
          grep "image:" docker-compose.yml | grep -v "#" | sed 's/.*image: //' | while read -r image; do
            echo "Checking $image..."
          done

  security-scan:
    name: Security Scan Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          trivy-version: 'latest'

      - name: Scan workflow files
        run: |
          echo "Scanning workflow JSON files for security issues..."
          scripts/security/scan-workflow-security.sh || true

      - name: Scan Docker images
        run: |
          echo "Scanning Docker images for vulnerabilities..."
          # Extract and scan images
          grep "image:" docker-compose.yml | grep -v "#" | sed 's/.*image: //' | while read -r image; do
            echo "Scanning $image..."
            trivy image --exit-code 0 --severity HIGH,CRITICAL "$image" || true
          done

  changelog-monitor:
    name: Monitor Changelogs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Monitor n8n changelog
        run: |
          echo "Checking n8n changelog..."
          curl -s "https://api.github.com/repos/n8n-io/n8n/releases?per_page=5" | jq -r '.[] | "\(.tag_name) - \(.published_at)"'

      - name: Create issue if security update
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security Update Available',
              body: 'A security update has been detected. Please review and update.',
              labels: ['security', 'update']
            })
