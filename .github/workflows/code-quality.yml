name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install black flake8 isort mypy

      - name: Run Black (code formatting)
        run: |
          black --check scripts/ src/ || true

      - name: Run isort (import sorting)
        run: |
          isort --check-only scripts/ src/ || true

      - name: Run flake8 (linting)
        run: |
          flake8 scripts/ src/ --max-line-length=120 --extend-ignore=E203,W503 || true

      - name: Run mypy (type checking)
        run: |
          mypy scripts/ src/ --ignore-missing-imports || true

  rust-quality:
    name: Rust Code Quality
    runs-on: ubuntu-latest
    if: hashFiles('src/rust/**/*.rs') != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Check formatting
        run: |
          cd src/rust
          cargo fmt --all -- --check || true

      - name: Run clippy
        run: |
          cd src/rust
          cargo clippy --all-targets --all-features -- -D warnings || true

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Install test dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Run Python tests
        run: |
          pytest tests/ -v --cov=scripts --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=70

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./tests/coverage.xml
          flags: python
          name: python-coverage

      - name: Check coverage threshold
        run: |
          coverage=$(pytest tests/ --cov=scripts --cov=src --cov-report=term --quiet | grep TOTAL | awk '{print $NF}' | sed 's/%//')
          if (( $(echo "$coverage < 70" | bc -l) )); then
            echo "::error::Test coverage ($coverage%) is below 70% threshold"
            exit 1
          fi
